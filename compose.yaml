name: majowolf-backend

x-node-service: &node-service
  image: node:22-alpine
  working_dir: /app
  networks:
    - backend
  restart: unless-stopped
  init: true
  stop_grace_period: 10s
  environment:
    MAJO_RESTART_SIGNAL: /app/.runtime/restart-token

services:
  proxy:
    <<: *node-service
    container_name: majowolf-proxy
    command: ["node", "proxy/server.mjs"]
    env_file:
      - ./deploy.proxy.env
    environment:
      MAJO_RESTART_SIGNAL: /app/.runtime/restart-token
      MAJO_PROXY_CONFIG: /app/proxy/proxy.config.json
    volumes:
      - ./server:/app/server:rw
      - ./proxy:/app/proxy:rw
      - ./shared:/app/shared:rw
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/proxy-server.crt:/app/certs/proxy-server.crt:ro
      - ./certs/proxy-server.key:/app/certs/proxy-server.key:ro
      - ./.runtime:/app/.runtime:rw

  main:
    <<: *node-service
    container_name: majowolf-main
    command: ["node", "server/main.mjs"]
    env_file:
      - ./deploy.main.env
    environment:
      MAJO_RESTART_SIGNAL: /app/.runtime/restart-token
      MAJO_MAIN_CONFIG: /app/server/main.config.compose.json
      MAJO_MULTIPLAYER_URL: ${MAJO_MULTIPLAYER_URL:-ws://multiplayer:34024/multiplayer}
    ports:
      - "127.0.0.1:34022:34022"
    volumes:
      - ./node_modules:/app/node_modules:ro
      - ./server:/app/server:rw
      - ./shared:/app/shared:rw
      - ./certs/ca.crt:/app/certs/ca.crt:ro
      - ./certs/main-client.crt:/app/certs/main-client.crt:ro
      - ./certs/main-client.key:/app/certs/main-client.key:ro
      - ./.runtime:/app/.runtime:rw
    depends_on:
      - proxy
      - multiplayer

  multiplayer:
    <<: *node-service
    container_name: majowolf-multiplayer
    command: ["node", "node_modules/tsx/dist/cli.mjs", "multiplayer/server.ts"]
    env_file:
      - ./deploy.main.env
    environment:
      MAJO_MULTIPLAYER_HOST: 0.0.0.0
      MAJO_MULTIPLAYER_PORT: 34024
      MAJO_MULTIPLAYER_STATE: /app/.runtime/multiplayer-rooms.json
      MAJO_MULTIPLAYER_ALLOWED_ORIGINS: ${MAJO_MULTIPLAYER_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    volumes:
      - ./multiplayer:/app/multiplayer:ro
      - ./src:/app/src:ro
      - ./shared:/app/shared:ro
      - ./server:/app/server:ro
      - ./node_modules:/app/node_modules:ro
      - ./.runtime:/app/.runtime:rw

networks:
  backend:
    driver: bridge
