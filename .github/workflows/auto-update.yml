name: Auto Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "proxy/**"
      - "shared/**"
      - "multiplayer/**"
      - "package.json"
      - "package-lock.json"
      - "src/ai/**"
      - "src/config/version.ts"
      - "src/data/**"
      - "src/domain/**"
      - "src/multiplayer/**"
      - "src/storage/gameStateSchema.ts"
  workflow_dispatch:
    inputs:
      dependencies_installed:
        description: "依赖文件变化时，是否已在部署机执行 npm ci"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed paths
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dependencies_installed }}" = "true" ]; then
            echo "changed=all" >> "$GITHUB_OUTPUT"
            echo "dependency_changed=false" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              DIFF_RANGE="HEAD~1 HEAD"
            elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE="HEAD~1 HEAD"
            else
              DIFF_RANGE="${{ github.event.before }} ${{ github.sha }}"
            fi
            if git diff --name-only $DIFF_RANGE | grep -qE '^package(-lock)?\.json$'; then
              echo "dependency_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "dependency_changed=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "changed=all" >> "$GITHUB_OUTPUT"
            else
              CHANGED=$(git diff --name-only $DIFF_RANGE | grep -E '^(server|proxy|shared|multiplayer)/|^src/(ai|data|domain|multiplayer)/|^src/config/version\.ts$|^src/storage/gameStateSchema\.ts$|^package(-lock)?\.json$' || true)
              if [ -z "$CHANGED" ]; then
                echo "changed=" >> "$GITHUB_OUTPUT"
              else
                echo "changed<<EOF" >> "$GITHUB_OUTPUT"
                echo "$CHANGED" >> "$GITHUB_OUTPUT"
                echo "EOF" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Stop for dependency installation
        if: ${{ steps.changes.outputs.dependency_changed == 'true' }}
        run: |
          echo "::error::package.json 或 package-lock.json 发生变化，自动更新器不会执行 npm ci，已停止远程重启"
          echo "::error::请在部署机同步依赖并执行 npm ci，然后通过 workflow_dispatch 重新运行部署"
          exit 1

      - name: Trigger backend update
        if: ${{ steps.changes.outputs.changed != '' && steps.changes.outputs.dependency_changed != 'true' }}
        env:
          MAIN_UPDATE_URL: ${{ secrets.MAIN_UPDATE_URL }}
          MAIN_UPDATE_PASS: ${{ secrets.MAIN_UPDATE_PASS }}
          PROXY_UPDATE_PASS: ${{ secrets.PROXY_UPDATE_PASS }}
        run: |
          if [ -z "$MAIN_UPDATE_PASS" ]; then
            echo "::error::MAIN_UPDATE_PASS secret 未配置，无法执行自动更新"
            exit 1
          fi
          if [ -z "$PROXY_UPDATE_PASS" ]; then
            echo "::error::PROXY_UPDATE_PASS secret 未配置，无法执行自动更新"
            exit 1
          fi
          URL="${MAIN_UPDATE_URL:-https://freeapi.majowolf.tkcloud.online/update}"
          echo "Changed paths:"
          echo "${{ steps.changes.outputs.changed }}"

          trigger_update() {
            local service_name="$1"
            local password="$2"
            echo "Triggering $service_name update at $URL"
            # curl 默认只重试瞬时 HTTP 状态；连接拒绝需显式加入。不要重试所有 4xx。
            if ! curl --fail-with-body -sS -X POST "$URL" \
              -H "Authorization: Bearer $password" \
              -H 'User-Agent: TKStudio:AlljustforKeng' \
              -H "Content-Type: application/json" \
              --max-time 120 \
              --retry 2 \
              --retry-connrefused \
              --retry-delay 5 \
              --retry-max-time 300 \
              -w "\nHTTP %{http_code}\n"; then
              echo "::error::$service_name 更新请求在有限重试后仍失败，详见上方响应"
              return 1
            fi
          }

          trigger_update "代理服务" "$PROXY_UPDATE_PASS"
          trigger_update "主服务" "$MAIN_UPDATE_PASS"
