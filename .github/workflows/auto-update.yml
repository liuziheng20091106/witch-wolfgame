name: Auto Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "proxy/**"
      - "shared/**"
      - "multiplayer/**"
      - "package.json"
      - "package-lock.json"
      - "src/ai/**"
      - "src/config/version.ts"
      - "src/data/**"
      - "src/domain/**"
      - "src/multiplayer/**"
      - "src/storage/gameStateSchema.ts"
  workflow_dispatch:
    inputs:
      dependencies_installed:
        description: "依赖文件变化时，是否已在部署机执行 npm ci"
        required: true
        type: boolean
        default: false
      deploy_baseline:
        description: "当前部署机已运行的提交 SHA（上次部署基线），用于计算自上次部署以来的完整变更范围；请在部署机执行 git rev-parse HEAD 获取（拉取新代码之前的值）。首次部署请先手动部署一次再获取基线"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed paths
        id: changes
        env:
          DEPLOY_BASELINE_INPUT: ${{ inputs.deploy_baseline }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASELINE="$DEPLOY_BASELINE_INPUT"
            if [ -z "$BASELINE" ]; then
              echo "::error::手动触发必须提供 deploy_baseline（当前部署机已运行的 commit SHA），无法判断依赖变更范围"
              exit 1
            fi
            if ! printf '%s' "$BASELINE" | grep -qE '^[0-9a-fA-F]{40}$'; then
              echo "::error::deploy_baseline 必须是 40 位十六进制 commit SHA：$BASELINE"
              exit 1
            fi
            if ! git rev-parse --verify -q "$BASELINE^{commit}" >/dev/null 2>&1; then
              echo "::error::deploy_baseline 不是有效提交：$BASELINE"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$BASELINE" HEAD; then
              echo "::error::deploy_baseline 不是 HEAD 的祖先提交，无法计算自上次部署以来的变更范围：$BASELINE"
              exit 1
            fi
            BASE="$BASELINE"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ]; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            if ! CHANGED=$(git diff --name-only "$EMPTY_TREE" HEAD); then
              echo "::error::无法计算首次推送（空树到 HEAD 全量变更）的文件列表，git diff 失败，已停止部署判断"
              exit 1
            fi
          else
            if ! CHANGED=$(git diff --name-only "$BASE" HEAD); then
              echo "::error::无法计算变更文件列表，git diff 失败（可能基准提交不存在），已停止部署判断"
              exit 1
            fi
          fi
          if printf '%s\n' "$CHANGED" | grep -qE '^package(-lock)?\.json$'; then
            DEP_CHANGED="true"
          else
            DEP_CHANGED="false"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DEP_CHANGED" = "true" ] && [ "${{ inputs.dependencies_installed }}" = "true" ]; then
            echo "dependency_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "dependency_changed=$DEP_CHANGED" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=all" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(printf '%s\n' "$CHANGED" | grep -E '^(server|proxy|shared|multiplayer)/|^src/(ai|data|domain|multiplayer)/|^src/config/version\.ts$|^src/storage/gameStateSchema\.ts$|^package(-lock)?\.json$' || true)
            if [ -z "$CHANGED" ]; then
              echo "changed=" >> "$GITHUB_OUTPUT"
            else
              echo "changed<<EOF" >> "$GITHUB_OUTPUT"
              echo "$CHANGED" >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Stop for dependency installation
        if: ${{ steps.changes.outputs.dependency_changed == 'true' }}
        run: |
          echo "::error::package.json 或 package-lock.json 发生变化，自动更新器不会执行 npm ci，已停止远程重启"
          echo "::error::请在部署机同步依赖并执行 npm ci，然后通过 workflow_dispatch 重新运行部署"
          exit 1

      - name: Trigger backend update
        if: ${{ steps.changes.outputs.changed != '' && steps.changes.outputs.dependency_changed != 'true' }}
        env:
          MAIN_UPDATE_URL: ${{ secrets.MAIN_UPDATE_URL }}
          MAIN_UPDATE_PASS: ${{ secrets.MAIN_UPDATE_PASS }}
          PROXY_UPDATE_PASS: ${{ secrets.PROXY_UPDATE_PASS }}
        run: |
          if [ -z "$MAIN_UPDATE_PASS" ]; then
            echo "::error::MAIN_UPDATE_PASS secret 未配置，无法执行自动更新"
            exit 1
          fi
          if [ -z "$PROXY_UPDATE_PASS" ]; then
            echo "::error::PROXY_UPDATE_PASS secret 未配置，无法执行自动更新"
            exit 1
          fi
          URL="${MAIN_UPDATE_URL:-https://freeapi.majowolf.tkcloud.online/update}"
          echo "Changed paths:"
          echo "${{ steps.changes.outputs.changed }}"

          trigger_update() {
            local service_name="$1"
            local password="$2"
            echo "Triggering $service_name update at $URL"
            # curl 默认只重试瞬时 HTTP 状态；连接拒绝需显式加入。不要重试所有 4xx。
            if ! curl --fail-with-body -sS -X POST "$URL" \
              -H "Authorization: Bearer $password" \
              -H 'User-Agent: TKStudio:AlljustforKeng' \
              -H "Content-Type: application/json" \
              --max-time 120 \
              --retry 2 \
              --retry-connrefused \
              --retry-delay 5 \
              --retry-max-time 300 \
              -w "\nHTTP %{http_code}\n"; then
              echo "::error::$service_name 更新请求在有限重试后仍失败，详见上方响应"
              return 1
            fi
          }

          trigger_update "代理服务" "$PROXY_UPDATE_PASS"
          trigger_update "主服务" "$MAIN_UPDATE_PASS"
